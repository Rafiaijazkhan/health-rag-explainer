<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — HealthLoop</title>
<style>
  :root {
    --cream: #E9D4C3;
    --navy: #13273F;
    --navy-70: rgba(19,39,63,0.72);
    --olive: #4B5335;
    --olive-dark: #3A4128;
    --maroon: #4E0000;
    --line: rgba(19,39,63,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--navy);
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 1px 0 rgba(19,39,63,0.03);
  }
  h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--navy-70);
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 18px;
    font-family: inherit;
  }
  input:focus {
    outline: 2px solid var(--navy);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--olive);
    color: var(--cream);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--olive-dark); }
  .flash {
    background: rgba(78,0,0,0.08);
    color: var(--maroon);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 18px;
  }
  .switch {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: var(--navy-70);
  }
  .switch a { color: var(--navy); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Welcome back to HealthLoop.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit">Sign in</button>
    </form>

    <div class="switch">
      Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
    </div>
  </div>
</body>
</html>
